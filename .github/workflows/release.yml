name: Build release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable ZIP
        shell: pwsh
        run: ./build-release.ps1 -Version "${{ github.ref_name }}"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem ./dist/*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName ($zip.FullName + '.sha256') --generate-notes --title "PZ Version & Mod Freezer ${{ github.ref_name }}"
