name: Build Vault release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vault-launcher/pnpm-lock.yaml
      - name: Install Vault dependencies
        working-directory: vault-launcher
        run: pnpm install --frozen-lockfile
      - name: Typecheck Vault
        working-directory: vault-launcher
        run: pnpm typecheck
      - name: Build Windows installer and portable app
        working-directory: vault-launcher
        run: pnpm dist:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem ./vault-launcher/release/*.exe
          $hashFile = './vault-launcher/release/SHA256SUMS.txt'
          $assets | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)" | Add-Content -LiteralPath $hashFile -Encoding utf8
          }
          gh release create "${{ github.ref_name }}" $assets.FullName $hashFile --notes-file "./docs/releases/v0.6.1-preview.md" --title "PZ Version & Mod Freezer ${{ github.ref_name }}"
